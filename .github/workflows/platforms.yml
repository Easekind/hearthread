name: Native platform builds
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: windows, target: x86_64-pc-windows-msvc }
          - { runner: macos-latest, platform: macos, target: aarch64-apple-darwin }
          - { runner: macos-latest, platform: ios, target: aarch64-apple-ios-sim }
          - { runner: ubuntu-latest, platform: android, target: aarch64-linux-android }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.platform == 'windows' || matrix.platform == 'macos'
        run: bun run tauri build --no-bundle --target ${{ matrix.target }}
      - if: matrix.platform == 'ios'
        run: bun run tauri ios build --debug --target aarch64-sim
      - if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager 'platforms;android-37'
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bun run tauri android build --debug --apk --target aarch64
